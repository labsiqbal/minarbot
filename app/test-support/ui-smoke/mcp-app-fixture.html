<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Weekly shipments</title>
<style>
:root { color-scheme: dark; font: 14px system-ui, sans-serif; }
body { margin: 0; }
main { box-sizing: border-box; padding: 18px; border: 1px solid var(--color-border-primary, GrayText); border-radius: 10px; background: var(--color-background-secondary, Canvas); color: var(--color-text-primary, CanvasText); }
h1 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0; color: var(--color-text-secondary, GrayText); }
figure { margin: 16px 0; display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: max-content minmax(0, 1fr) 26px; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.bar meter { height: 16px; width: 100%; accent-color: #318880; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
button { min-height: 40px; padding: 6px 10px; font: inherit; color: inherit; background: var(--color-background-tertiary, ButtonFace); border: 1px solid var(--color-border-primary, GrayText); border-radius: 7px; cursor: pointer; }
output:not(:empty) { display: block; margin-top: 8px; }
summary { margin-bottom: 8px; cursor: pointer; }
details p { margin-bottom: 8px; }
</style>
<script src="https://assets.example.test/chart.js"></script>
<body>
<main>
  <h1>Weekly shipments</h1>
  <p>Warehouse inventory · October</p>
  <figure aria-label="Shipments by week">
    <label class="bar"><span>Week 1</span><meter min="0" max="100" value="32">32</meter><span>32</span></label>
    <label class="bar"><span>Week 2</span><meter min="0" max="100" value="45">45</meter><span>45</span></label>
    <label class="bar"><span>Week 3</span><meter min="0" max="100" value="62">62</meter><span>62</span></label>
  </figure>
  <details><summary>View inventory notes</summary><p>Week 3 includes delayed shipments from the previous week.</p></details>
  <div class="actions">
    <button id="lookup">Refresh totals</button>
    <button id="save">Save selection</button>
    <button id="context">Attach context</button>
    <button id="ask">Ask agent</button>
    <button id="link">Inventory guide</button>
  </div>
  <output aria-live="polite"></output>
</main>
<script>
  const rpc = (method, params, id) => parent.postMessage({ jsonrpc: '2.0', method, params, id }, '*');
  const output = text => { document.querySelector('output').textContent = text; };
  const main = document.querySelector('main');
  const setTheme = context => {
    document.documentElement.dataset.theme = context.theme;
    document.documentElement.style.colorScheme = context.theme;
    for (const [name, value] of Object.entries(context.styles.variables)) {
      document.documentElement.style.setProperty(name, value);
    }
  };
  addEventListener('message', ({ source, origin, data }) => {
    if (source !== parent || origin !== 'null' || data?.jsonrpc !== '2.0') return;
    if (data.id === 'init') {
      document.body.dataset.protocol = data.result.protocolVersion;
      setTheme(data.result.hostContext);
      rpc('ui/notifications/initialized', {});
      rpc('ui/notifications/size-changed', { height: main.offsetHeight });
    }
    if (data.method === 'ui/notifications/host-context-changed') setTheme(data.params);
    if (data.method === 'ui/notifications/tool-input') document.body.dataset.input = data.params.arguments.warehouse;
    if (data.method === 'ui/notifications/tool-result') document.body.dataset.total = data.params.structuredContent.total;
    if (data.id === 'before-init') document.body.dataset.preInit = data.error?.code;
    else if (data.id && data.id !== 'init') output(data.error?.message ?? data.result.content?.[0]?.text ?? 'Request complete');
  });
  new ResizeObserver(() => rpc('ui/notifications/size-changed', { height: main.offsetHeight })).observe(main);
  const text = { type: 'text', text: 'Compare all three weeks.' };
  lookup.onclick = () => rpc('tools/call', { name: 'lookup' }, 'lookup');
  save.onclick = () => rpc('tools/call', { name: 'save', arguments: { week: 3 } }, 'save');
  context.onclick = () => rpc('ui/update-model-context', { structuredContent: { week: 3 } }, 'context');
  ask.onclick = () => rpc('ui/message', { role: 'user', content: [text] }, 'ask');
  link.onclick = () => rpc('ui/open-link', { url: 'https://guide.example.test/inventory' }, 'link');
  rpc('tools/call', { name: 'lookup' }, 'before-init');
  rpc('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'Shipment fixture', version: '1' }, appCapabilities: {} }, 'init');
</script>
</body>
</html>
