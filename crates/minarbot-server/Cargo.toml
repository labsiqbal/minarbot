[package]
name = "minarbot-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
minarbot-launcher = { path = "../minarbot-launcher" }
flate2 = "1"
ammonia = "4"
html5ever = "0.40"
regex = "1"
ring = "0.17"
curve25519-dalek = "4"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-stream = "0.3"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
base64 = "0.22"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
jsonwebtoken = "9"
rusqlite = { version = "0.31", features = ["bundled", "functions", "backup", "hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
sha2 = "0.10"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustix = { version = "1", features = ["fs", "process", "system"] }

subtle = "2"
unicode-normalization = "0.1"
idna = "1"
moxcms = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
# keyring's native backend uses Apple Keychain via security-framework (MIT OR Apache-2.0).
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
