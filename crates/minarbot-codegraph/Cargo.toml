[package]
name = "minarbot-codegraph"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0 AND MIT"
publish = false

[features]
default = ["rust", "typescript", "javascript", "python", "go"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript"]
javascript = ["dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
go = ["dep:tree-sitter-go"]

[dependencies]
ignore = "0.4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tree-sitter = "=0.25.10"
tree-sitter-go = { version = "=0.23.4", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-python = { version = "=0.23.6", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
