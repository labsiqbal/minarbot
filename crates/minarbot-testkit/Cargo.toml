[package]
name = "minarbot-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Dev-only integration-test kit: disposable Minarbot servers, fake harness peers and a scripted model."

# Every dependency below is already in the workspace lock file through
# minarbot-server, so the kit adds no new third-party code.
[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
jsonwebtoken = "9"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { workspace = true, features = ["functions"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake-acp.rs"

[[bin]]
name = "fake-gateway"
path = "src/bin/fake-gateway.rs"

[lints]
workspace = true
