[package]
name = "minarbot-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Keep the browser target and its pins independent of the native workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
conversation = []
workflows = []

[dependencies]
base64 = "0.22"
crc32fast = "1"
serde_yaml = "0.9"
zip = { version = "=7.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wasm-bindgen-futures = "=0.4.80"
gloo-net = { version = "=0.6.0", default-features = false, features = ["http", "json"] }
js-sys = "=0.3.107"
leptos = { version = "=0.8.23", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = [
    "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Clipboard", "ClipboardEvent",
    "Crypto", "CssStyleDeclaration", "DataTransfer", "DomRect", "DragEvent", "EventSource",
    "File", "FileList", "FormData", "History", "HtmlAnchorElement", "HtmlDetailsElement",
    "HtmlDialogElement", "HtmlDocument", "HtmlFormElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Location", "MediaQueryList", "MessageEvent", "Navigator", "NodeList", "Notification",
    "NotificationOptions", "NotificationPermission", "PopStateEvent", "ResizeObserver", "SpeechSynthesis",
    "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "Storage", "StorageEvent", "SubmitEvent", "Url", "UrlSearchParams", "VisibilityState",
] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
