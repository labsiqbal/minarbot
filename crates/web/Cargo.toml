[package]
name = "minarbot-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Keep the browser target and its pins independent of the native workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gloo-net = { version = "=0.6.0", default-features = false, features = ["http", "json"] }
js-sys = "=0.3.107"
leptos = { version = "=0.8.23", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = [
    "AbortController", "AbortSignal", "Blob", "Clipboard", "CssStyleDeclaration", "DomRect",
    "HtmlAnchorElement", "Navigator", "Url",
    "Crypto", "History", "HtmlDialogElement", "HtmlInputElement", "Location", "MediaQueryList", "NodeList",
    "Notification", "NotificationPermission", "PopStateEvent", "SpeechSynthesis",
    "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "Storage", "StorageEvent", "SubmitEvent", "UrlSearchParams",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
