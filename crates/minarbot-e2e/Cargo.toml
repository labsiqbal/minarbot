[package]
name = "minarbot-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "End-to-end tests that drive the real minarbot-server binary through minarbot-testkit."

# The tests spawn target/<profile>/minarbot-server and the kit's fake peers.
# Build them first: `cargo build -p minarbot-server -p minarbot-testkit`.
[dev-dependencies]
minarbot-testkit = { path = "../minarbot-testkit" }
ring = "0.17"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "io-util", "process", "rt-multi-thread", "time"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lints]
workspace = true
