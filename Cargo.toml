[workspace]
members = ["crates/minarbot-server", "crates/minarbot-launcher", "crates/minarbot-codegraph", "crates/minarbot-memory", "crates/minarbot-testkit", "crates/minarbot-e2e", "crates/xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Bundled SQLite must check FTS5 indexes in read-only update snapshots.
rusqlite = { version = "0.32.1", features = ["bundled"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# `cargo xtask preview`: an optimized server that rebuilds incrementally.
[profile.preview]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
