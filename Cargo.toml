[workspace]
members = ["crates/minarbot-server", "crates/minarbot-launcher", "crates/minarbot-codegraph", "crates/minarbot-memory", "crates/xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
