name: Build release draft
on:
  workflow_dispatch:
    inputs:
      notes:
        description: User-facing release notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  runtime:
    name: Runtime and desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev patchelf
      - name: Build runtime
        run: |
          npm --prefix app ci
          npm --prefix app run build
          cargo xtask leptos
          cargo build --workspace --release --locked --features minarbot-server/codegraph-all-languages
          cargo xtask release --pack-ci target/release --output artifacts --notes "$RELEASE_NOTES"
          test -n "$(find artifacts -name "*-${{ matrix.platform }}.tar.gz")"
      - name: Install and exercise the macOS service
        if: runner.os == 'macOS'
        run: cargo xtask install-smoke target/release
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Build desktop
        env:
          MINARBOT_TAURI_UPDATER_PUBKEY: ${{ vars.MINARBOT_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo xtask desktop --runtime artifacts/*-${{ matrix.platform }}.tar.gz --output desktop-output
      - name: Check macOS app signature
        if: runner.os == 'macOS'
        run: |
          volume=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "$volume" desktop-output/Minarbot-Tauri-*.dmg
          trap 'hdiutil detach "$volume"' EXIT
          codesign --verify --deep --strict "$volume/Minarbot Tauri.app"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop-output/*.AppImage
            desktop-output/*.dmg
            desktop-output/Minarbot-Tauri-*.sig
            desktop-output/tauri-latest-*.json
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-linux-x86_64
          path: runtime
      - name: Build Windows NSIS installer
        env:
          MINARBOT_TAURI_UPDATER_PUBKEY: ${{ vars.MINARBOT_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $archives = @(Get-ChildItem runtime -Filter '*-linux-x86_64.tar.gz' -File)
          if ($archives.Count -ne 1) { throw 'Expected one Linux x86_64 runtime archive.' }
          cargo xtask desktop --runtime ($archives[0].FullName) --output desktop-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop-output/*.exe
            desktop-output/Minarbot-Tauri-*.sig
            desktop-output/tauri-latest-*.json
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: [runtime, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload unsigned draft and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          MINARBOT_GHCR_USER: ${{ github.actor }}
          MINARBOT_GHCR_TOKEN: ${{ github.token }}
        run: cargo xtask release --draft-ci artifacts --notes "$RELEASE_NOTES"
