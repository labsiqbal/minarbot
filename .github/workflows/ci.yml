name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Without a cache every run compiled all dependencies from scratch.
      # Only main saves it, so pull requests do not fill the cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/web -> target
            desktop/tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev libsqlite3-dev poppler-utils libwebkit2gtk-4.1-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - working-directory: app
        run: npm ci
      - name: Lint and type-check browser adapters
        working-directory: app
        run: npm run lint && npm run build
      # The e2e browser smokes serve the built client in the runner's Chrome.
      - name: Build Leptos web client
        run: cargo xtask leptos
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: cargo xtask install-smoke target/debug
      - name: Check Tauri desktop
        working-directory: desktop/tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
