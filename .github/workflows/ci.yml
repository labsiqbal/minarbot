name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev libsqlite3-dev poppler-utils libwebkit2gtk-4.1-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - working-directory: app
        run: npm ci
      - name: Lint and type-check browser adapters
        working-directory: app
        run: npm run lint && npm run build
      - name: Build Leptos web client
        run: cargo xtask leptos
      - working-directory: app/test-support/ui-smoke
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          node appearance-smoke.mjs
      - run: cargo xtask install-smoke target/debug
      - name: Check Tauri desktop
        working-directory: desktop/tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
