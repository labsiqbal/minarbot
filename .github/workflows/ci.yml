name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev libsqlite3-dev poppler-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The e2e browser smokes serve the built client in the runner's Chrome.
      - name: Build Leptos web client
        run: cargo xtask leptos
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - working-directory: app
        run: npm ci
      - name: Lint and type-check Node tests and browser adapters
        working-directory: app
        run: npm run lint && npm run build
      - name: App tests against Rust workspace and hosted Hub
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          MINARBOT_XTASK_BINARY: ${{ github.workspace }}/target/debug/xtask
          MINARBOT_RUST_BINARY: ${{ github.workspace }}/target/debug/minarbot-server
          MINARBOT_HOSTED_HUB_BINARY: ${{ github.workspace }}/target/debug/minarbot-server
          MINARBOT_RUST_LAUNCHER_BINARY: ${{ github.workspace }}/target/debug/minarbot-launcher
        run: npm test
      - run: cargo xtask install-smoke target/debug
      - working-directory: desktop
        run: npm test
